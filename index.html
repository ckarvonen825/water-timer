<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" href="images/forest.jpg" as="image">
    <link rel="preload" href="images/ocean.jpg" as="image">
    <link rel="preload" href="images/sunset.jpg" as="image">
    <link rel="preload" href="images/night.jpg" as="image">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&family=Molengo&family=Quicksand:wght@300..700&family=Rethink+Sans:ital,wght@0,400..800;1,400..800&family=Short+Stack&display=swap" rel="stylesheet">
    <link rel="icon" href="images/favicon.ico">
</head>
<body>

    <div id="mobile-warning" class="hidden">
        <div class="warning-content">
            <p>⚠️ This app was built for desktop browsers. On mobile, background timers may be unpredictable.</p>
            <button id="understandBtn">I Understand</button>
        </div>
    </div>  
    <!-- <div>
        <a href="https://www.buymeacoffee.com/ckarvonen" target="_blank"><img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="Buy Me a Coffee" style="height: 60px !important;width: 217px !important;" ></a>
    </div> -->
    <div id="subheader">
        <div id="setTime">
            <h3>Remind me to drink water every...</h3>
            <select name="time" id="time">
                <!-- <option value="0.1">Couple Seconds (test)</option> -->
                <option value="10">10 Minutes</option>
                <option value="15">15 Minutes</option>
                <option value="20">20 Minutes</option>
                <option value="30">30 Minutes</option>
                <option value="45">45 Minutes</option>
                <option value="60">60 Minutes</option>
            </select>
        </div>
    </div>

    <div id="timerDiv">
        <div id="timer">
            <svg viewBox="0 0 200 200">
                <text id="sipCounter" x="100" y="100" text-anchor="middle" dominant-baseline="middle">Sips: 0</text>
                <circle id="baseCircle" cx="100" cy="100" r="75"></circle>
                <circle id="timerCircle" cx="100" cy="100" r="75"></circle>
                <text id="timerText" x="100" y="100" text-anchor="middle" dominant-baseline="middle">00:00</text>
            </svg>
            <div id="startButton">
                <button id="button">Start</button>
            </div> 
        </div>
    </div>

    <div class="customizations">
        <div class="custom-box"> 
            <p>Choose Theme</p>
            <div class="theme-buttons">
                <button data-theme="ocean">Ocean</button>
                <button data-theme="forest" class="active">Forest</button>
                <button data-theme="night">Night</button>
                <button data-theme="sunset">Sunset</button>
            </div>
        </div>
        <div class="custom-box">
            <p>Choose Sound</p>
            <div class="sound-buttons">
                <button data-sound="drop">Drop</button>
                <button data-sound="chime">Chime</button>
                <button data-sound="harp">Harp</button>
                <button data-sound="bell">Bell</button>
            </div>
        </div>
    </div>
    <div id="selectSoundAlert">
        <p>Choose a sound first!</p>
    </div>


    <script src="scripts.js"></script>
</body>

</html>
